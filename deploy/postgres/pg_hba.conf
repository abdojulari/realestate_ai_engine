# pg_hba.conf — Docker-internal trust auth
# All connections come from containers on the same Docker bridge network.
# Postgres port is bound to 127.0.0.1 only (not exposed to the internet).
# This eliminates SCRAM-SHA-256 auth failures under sustained write load.

# TYPE  DATABASE  USER  ADDRESS       METHOD
local   all       all                 trust
host    all       all   0.0.0.0/0     trust
host    all       all   ::/0          trust
