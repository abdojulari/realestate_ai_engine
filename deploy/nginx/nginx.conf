user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time '
                    '"$host"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # ── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/xml application/json application/rss+xml
               image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ── Rate limiting ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Upstreams ─────────────────────────────────────────────────
    upstream suhani_app {
        server suhani:3000;
        keepalive 32;
    }

    upstream control_plane_app {
        server control-plane:3001;
        keepalive 16;
    }

    # ── SSL defaults ──────────────────────────────────────────────
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Shared proxy headers (DRY) ────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =================================================================
    #  deelbot.com — SaaS Control Plane (marketing, signup, payments)
    # =================================================================

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name deelbot.com www.deelbot.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name deelbot.com www.deelbot.com;

        ssl_certificate     /etc/letsencrypt/live/deelbot.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deelbot.com/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Stripe webhooks — higher rate limit, no body buffering
        location /api/webhooks/ {
            limit_req zone=webhook burst=20 nodelay;
            proxy_pass http://control_plane_app;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # API
        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://control_plane_app;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://control_plane_app;
            proxy_buffering off;
        }

        # Nuxt static assets
        location /_nuxt/ {
            proxy_pass http://control_plane_app;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Default
        location / {
            limit_conn addr 50;
            proxy_pass http://control_plane_app;
        }

        # Health check
        location /health {
            access_log off;
            proxy_pass http://control_plane_app;
        }

        location ~ /\. { deny all; return 404; }
    }

    # =================================================================
    #  deelbot.ai apex + *.deelbot.ai — Suhani Tenant App
    # =================================================================
    # Apex MUST be listed: `*.deelbot.ai` does not match the bare apex,
    # and OAUTH_CANONICAL_HOST=https://deelbot.ai routes Google/Facebook
    # callbacks through it. Without the apex here the request falls
    # through to the catch-all default_server (return 444) and Chrome
    # surfaces ERR_HTTP2_PROTOCOL_ERROR (the HTTP/2 stream is reset
    # before any response headers are written).

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name deelbot.ai *.deelbot.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (wildcard cert covers both apex and subdomains)
    server {
        listen 443 ssl http2;
        server_name deelbot.ai *.deelbot.ai;

        ssl_certificate     /etc/letsencrypt/live/deelbot.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deelbot.ai/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https: wss:;" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Domain $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Auth rate limiting
        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://suhani_app;
            proxy_buffering off;
        }

        # MLS sync endpoints need long timeouts (data pulls can take minutes)
        location /api/admin/pillar9/ {
            proxy_pass http://suhani_app;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        location /api/admin/crea/ {
            proxy_pass http://suhani_app;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://suhani_app;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # WebSocket
        location /ws {
            proxy_pass http://suhani_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        location ^~ /uploads/ {
            proxy_pass http://suhani_app;
            proxy_buffering off;
        }

        # Nuxt static assets
        location /_nuxt/ {
            proxy_pass http://suhani_app;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Default
        location / {
            limit_conn addr 50;
            proxy_pass http://suhani_app;
        }

        # Health check
        location /health {
            access_log off;
            proxy_pass http://suhani_app;
        }

        location ~ /\. { deny all; return 404; }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # =================================================================
    #  Tenant custom domains → Suhani (per-hostname certs)
    # =================================================================
    include /etc/nginx/conf.d/custom-domains.conf;

    # =================================================================
    #  Default: unknown hosts (HTTP allows ACME for any hostname on this IP)
    # =================================================================
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 444;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/deelbot.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deelbot.com/privkey.pem;

        return 444;
    }
}
