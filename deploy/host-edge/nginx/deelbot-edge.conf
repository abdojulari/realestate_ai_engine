# Host Nginx — Terminates TLS on :80 / :443 and proxies to Docker Nuxt apps (Option B).
# Install: deploy/host-edge/install-debian.sh (from Suhani repo).
#
# Upstreams: Suhani and control-plane containers must publish loopback only, e.g.
#   SUHANI_APP_PORTS=127.0.0.1:3000:3000
#   CP_APP_PORTS=127.0.0.1:3001:3001
#
# TLS: bootstrap self-signed at /etc/nginx/ssl/deelbot-edge.* (install script) or replace with
# Let's Encrypt paths below after certbot.

limit_req_zone $binary_remote_addr zone=suhani_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=suhani_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cp_webhooks:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cp_signup:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=suhani_addr:10m;

upstream suhani_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream control_plane {
    server 127.0.0.1:3001;
    keepalive 16;
}

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:DEELBOT_SSL:20m;
ssl_session_timeout 1d;

# ─── HTTP — control plane ─────────────────────────────────────────
server {
    listen 80;
    server_name www.deelbot.com deelbot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.deelbot.com$request_uri;
    }
}

# ─── HTTP — tenant subdomains ───────────────────────────────────
server {
    listen 80;
    server_name *.deelbot.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTP — default (ACME for other hostnames) ──────────────────
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

# ─── HTTPS — control plane (deelbot.com) ──────────────────────
server {
    listen 443 ssl http2;
    server_name www.deelbot.com deelbot.com;

    # Replace after: certbot certonly --webroot -w /var/www/certbot -d www.deelbot.com -d deelbot.com
    ssl_certificate     /etc/nginx/ssl/deelbot-edge-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/deelbot-edge-privkey.pem;

    if ($host = deelbot.com) {
        return 301 https://www.deelbot.com$request_uri;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    location /api/webhooks/ {
        limit_req zone=cp_webhooks burst=20 nodelay;
        proxy_pass http://control_plane;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/tenants {
        limit_req zone=cp_signup burst=5 nodelay;
        proxy_pass http://control_plane;
    }

    location /api/ {
        proxy_pass http://control_plane;
        proxy_buffering off;
    }

    location /_nuxt/ {
        proxy_pass http://control_plane;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://control_plane;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}

# ─── HTTPS — Suhani (*.deelbot.ai) ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name *.deelbot.ai;

    # Same bootstrap cert must cover *.deelbot.ai (install script SAN) or use a wildcard LE cert path.
    ssl_certificate     /etc/nginx/ssl/deelbot-edge-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/deelbot-edge-privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Tenant-Domain $host;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 50m;

    location /api/auth/ {
        limit_req zone=suhani_login burst=10 nodelay;
        proxy_pass http://suhani_app;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=suhani_api burst=50 nodelay;
        proxy_pass http://suhani_app;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /ws {
        proxy_pass http://suhani_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
    }

    location /uploads/ {
        proxy_pass http://suhani_app;
        proxy_buffering off;
    }

    location /_nuxt/ {
        proxy_pass http://suhani_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_conn suhani_addr 50;
        proxy_pass http://suhani_app;
    }

    location /health {
        access_log off;
        proxy_pass http://suhani_app;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}

# ─── HTTPS — default (reject unknown hosts) ─────────────────────
server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/deelbot-edge-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/deelbot-edge-privkey.pem;

    return 444;
}
