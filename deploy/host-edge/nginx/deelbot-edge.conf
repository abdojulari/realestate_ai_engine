# Host Nginx — Terminates TLS on :80 / :443 and proxies to Docker Nuxt apps (Option B).
# Install: deploy/host-edge/install-debian.sh (from Suhani repo).
#
# Upstreams: Suhani and control-plane containers must publish loopback only, e.g.
#   SUHANI_APP_PORTS=127.0.0.1:3000:3000
#   CP_APP_PORTS=127.0.0.1:3001:3001
#
# TLS paths: /etc/nginx/snippets/deelbot-com.ssl.inc and deelbot-ai.ssl.inc (bootstrap from
# install-debian.sh; issue-le-certs.sh rewrites them to /etc/letsencrypt/live/...).
#
# Control plane (www.deelbot.com) HTTPS routing selects direct :3001 vs Docker nginx hop:
#   install-debian.sh sets /etc/nginx/snippets/deelbot-com-https-app.inc from
#   DEELBOT_COM_PROXY_MODE=direct|docker (default direct). See deploy/host-edge/README.md.

limit_req_zone $binary_remote_addr zone=suhani_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=suhani_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cp_webhooks:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cp_signup:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=suhani_addr:10m;

upstream suhani_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream control_plane {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Plain-HTTP second hop when DEELBOT_COM_PROXY_MODE=docker (host :443 TLS only).
# Port must match the numeric port in Suhani NGINX_PUBLISH_HTTP_HOST_PORT (e.g. …:9080) or NGINX_PUBLISH_HTTP_PORT.
# 127.0.0.1:9080:80 in production so :9080 is not exposed on the public interface.
upstream deelbot_com_docker_http {
    server 127.0.0.1:9080;
    keepalive 8;
}

# TLS policy: use defaults from /etc/nginx/nginx.conf (Debian/Ubuntu already set ssl_protocols /
# ssl_prefer_server_ciphers in http {}). Do not repeat them here — conf.d is merged into the same
# http {} block and nginx rejects duplicates.

# ─── HTTP — control plane ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.deelbot.com deelbot.com;

    include /etc/nginx/snippets/deelbot-acme.inc;

    location / {
        return 301 https://www.deelbot.com$request_uri;
    }
}

# ─── HTTP — deelbot.ai apex + tenant subdomains ──────────────────
# Apex is required: OAUTH_CANONICAL_HOST=https://deelbot.ai routes every
# Google/Facebook OAuth callback through the bare apex, and `*.deelbot.ai`
# does not match it. Without the apex here the request falls through to
# the catch-all `default_server` (return 444) and Chrome reports
# ERR_HTTP2_PROTOCOL_ERROR because the HTTP/2 stream is reset before the
# server writes any response headers.
server {
    listen 80;
    listen [::]:80;
    server_name deelbot.ai *.deelbot.ai;

    include /etc/nginx/snippets/deelbot-acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTP — default (ACME for other hostnames) ──────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/deelbot-acme.inc;

    location / {
        return 444;
    }
}

# ─── HTTPS — control plane (deelbot.com) ──────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.deelbot.com deelbot.com;

    include /etc/nginx/snippets/deelbot-com.ssl.inc;

    if ($host = deelbot.com) {
        return 301 https://www.deelbot.com$request_uri;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    include /etc/nginx/snippets/deelbot-com-https-app.inc;
}

# ─── HTTPS — Suhani (deelbot.ai apex + *.deelbot.ai) ─────────────
# Apex is required for the OAuth canonical-callback flow (see HTTP block
# above). The wildcard cert issued by issue-le-certs.sh already includes
# both `deelbot.ai` and `*.deelbot.ai`, so a single server block covers
# every hostname.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deelbot.ai *.deelbot.ai;

    include /etc/nginx/snippets/deelbot-ai.ssl.inc;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Tenant-Domain $host;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 50m;

    # MLS sync endpoints need long timeouts (data pulls can take several minutes)
    location /api/admin/pillar9/ {
        proxy_pass http://suhani_app;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    location /api/admin/crea/ {
        proxy_pass http://suhani_app;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    location /api/auth/ {
        limit_req zone=suhani_login burst=10 nodelay;
        proxy_pass http://suhani_app;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=suhani_api burst=50 nodelay;
        proxy_pass http://suhani_app;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /ws {
        proxy_pass http://suhani_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
    }

    location ^~ /uploads/ {
        proxy_pass http://suhani_app;
        proxy_buffering off;
    }

    location /_nuxt/ {
        proxy_pass http://suhani_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_conn suhani_addr 50;
        proxy_pass http://suhani_app;
    }

    location /health {
        access_log off;
        proxy_pass http://suhani_app;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}

# ─── HTTPS — default (reject unknown hosts) ─────────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    include /etc/nginx/snippets/deelbot-com.ssl.inc;

    return 444;
}
