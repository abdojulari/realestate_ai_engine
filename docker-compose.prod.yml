# Production overlay: merge with docker-compose.yml (do not use `include` here — some Compose versions
# error with "conflicts with imported resource" when overriding `app` from an included file).
# Server: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d  (or ./scripts/deploy.sh)
# Local without nginx/TLS: docker compose up  (docker-compose.yml only)

services:
  db:
    restart: unless-stopped
    container_name: suhani-postgres
    shm_size: 256mb
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "hba_file=/var/lib/postgresql/pg_hba_custom.conf"
    ports:
      - "127.0.0.1:${SUHANI_POSTGRES_PUBLISH_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-real_estate}"]

  redis:
    restart: unless-stopped
    container_name: suhani-redis
    # Loopback-only publish + password auth. Audit alerts (open Redis on the internet) come from
    # publishing 6379/6381 on 0.0.0.0 with no requirepass — an attacker can read/write all keys
    # and pivot via debug/lua. Loopback alone is not enough on multi-tenant VPS, hence requirepass.
    ports:
      - "127.0.0.1:${SUHANI_REDIS_PUBLISH_PORT:-6381}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SUHANI_DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-real_estate}?schema=public&connection_limit=10}
      REDIS_URL: ${SUHANI_DOCKER_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
      # Both must stay empty in multi-tenant deployments — see suhani.env.example.
      # Setting either to an absolute URL bakes that single hostname into the
      # shared client bundle and breaks every other tenant with CORS / wrong
      # canonical tags. Empty value → Nuxt uses "/api" (relative) and derives
      # siteUrl per-request from the Host header.
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-deelbot.ai}
      # Must be set in .env.production (Turnstile + SSR). Repeated here so prod overlay never drops them vs base compose merge.
      NUXT_PUBLIC_SITE_KEY: ${NUXT_PUBLIC_SITE_KEY:-}
      NUXT_TURNSTILE_SECRET_KEY: ${NUXT_TURNSTILE_SECRET_KEY:-${NUXT_PUBLIC_SECRET_KEY:-}}
      NUXT_TURNSTILE_VERIFY_URL: ${NUXT_TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      # Geoapify (nearby POI on property detail)
      NUXT_PUBLIC_GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-${VITE_GEOAPIFY:-}}
      # AI Chat
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_URL: ${GROQ_API_URL:-https://api.groq.com/openai/v1}
      # Compliance-review LLM failover chain — see server/utils/llm.ts.
      # Any one provider is enough; all three gives the most quota headroom.
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_API_URL: ${CEREBRAS_API_URL:-https://api.cerebras.ai/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-}
      # CREA DDF
      CREA_CLIENT_ID: ${CREA_CLIENT_ID:-}
      CREA_CLIENT_SECRET: ${CREA_CLIENT_SECRET:-}
      CREA_BASE_URL: ${CREA_BASE_URL:-https://ddfapi.realtor.ca}
      # Pillar9 / Matrix
      PILLAR9_CLIENT_ID: ${PILLAR9_CLIENT_ID:-}
      PILLAR9_CLIENT_SECRET: ${PILLAR9_CLIENT_SECRET:-}
      PILLAR9_API_HOST: ${PILLAR9_API_HOST:-abrls.matrixwebapi.com}
      PILLAR9_SYNC_SECRET: ${PILLAR9_SYNC_SECRET:-${CRON_SECRET:-}}
      # SMTP
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HOSTNAME: ${SMTP_HOSTNAME:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SENDER: ${SMTP_SENDER:-noreply@homebyabdul.com}
      AGENT_EMAIL: ${AGENT_EMAIL:-}
      # Verdocs e-sign
      VERDOCS_CLIENT_ID: ${VERDOCS_CLIENT_ID:-}
      VERDOCS_CLIENT_SECRET: ${VERDOCS_CLIENT_SECRET:-}
      VERDOCS_API_BASE: ${VERDOCS_API_BASE:-https://api.verdocs.com}
      VERDOCS_API_URL: ${VERDOCS_API_URL:-https://api.verdocs.com/oauth/token}
      # Stripe billing is owned by saas-control-plane — not used here.
      # License
      LICENSE_TIER: ${LICENSE_TIER:-platinum}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-}
      # Hashnode blog
      HASHNODE_API_KEY: ${HASHNODE_API_KEY:-}
      HASHNODE_API_URL: ${HASHNODE_API_URL:-https://gql.hashnode.com}
      # Google Analytics
      NUXT_PUBLIC_GTAG_ID: ${NUXT_PUBLIC_GTAG_ID:-G-8ZEBQRGHTQ}
      # Meta (Facebook) Pixel — platform-wide default; per-tenant override
      # in TenantSettings.metaPixelId takes precedence at request time.
      NUXT_PUBLIC_META_PIXEL_ID: ${NUXT_PUBLIC_META_PIXEL_ID:-1304047971150913}
      # Meta Conversions API token (server-only). Pair with the pixel above.
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      # Geocoding
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-${VITE_GEOAPIFY:-}}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-}
      # Facebook
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Multi-tenant OAuth canonical callback. With these set, every
      # tenant subdomain (`tonahomes.deelbot.ai`, `aohomes.deelbot.ai`,
      # …) routes Google login through `<canonical>/api/auth/google/callback`,
      # so you only register ONE redirect URI in Google Cloud Console
      # instead of one per tenant. Defaults below match the deelbot.ai
      # SaaS deployment; override per environment as needed.
      OAUTH_CANONICAL_HOST: ${OAUTH_CANONICAL_HOST:-https://deelbot.ai}
      OAUTH_ALLOWED_HOST_SUFFIX: ${OAUTH_ALLOWED_HOST_SUFFIX:-deelbot.ai}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Reach saas-control-plane on the host (127.0.0.1:3001) from inside this container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Defaults 9080/9443 assume another reverse proxy (or host nginx) owns public :80/:443.
    # If THIS container should terminate TLS for www.deelbot.com on the Internet,
    # set NGINX_PUBLISH_HTTP_PORT=80 and NGINX_PUBLISH_HTTPS_PORT=443 in .env.production
    # and ensure nothing else binds those ports.
    #
    # Host binding: use NGINX_PUBLISH_HTTP_HOST_PORT / NGINX_PUBLISH_HTTPS_HOST_PORT when the
    # left side of the map must be `ip:port` (e.g. loopback-only for hybrid host-edge — see
    # deploy/host-edge/README.md §2b). If unset, falls back to NGINX_PUBLISH_HTTP(S)_PORT.
    ports:
      - "${NGINX_PUBLISH_HTTP_HOST_PORT:-${NGINX_PUBLISH_HTTP_PORT:-9080}}:80"
      - "${NGINX_PUBLISH_HTTPS_HOST_PORT:-${NGINX_PUBLISH_HTTPS_PORT:-9443}}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Wait for the app to be healthy (not just started) before nginx
    # accepts traffic. Without this, nginx briefly serves 502s during
    # cold start while Nuxt/Prisma boot. Combined with the dynamic
    # resolver in nginx.conf, restarts and rebuilds are now seamless.
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network
