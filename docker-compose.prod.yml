# Production overlay: merge with docker-compose.yml (do not use `include` here — some Compose versions
# error with "conflicts with imported resource" when overriding `app` from an included file).
# Server: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d  (or ./scripts/deploy.sh)
# Local without nginx/TLS: docker compose up  (docker-compose.yml only)

services:
  db:
    restart: unless-stopped
    container_name: suhani-postgres
    shm_size: 256mb
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "hba_file=/var/lib/postgresql/pg_hba_custom.conf"
    ports:
      - "127.0.0.1:${SUHANI_POSTGRES_PUBLISH_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-real_estate}"]

  redis:
    restart: unless-stopped
    container_name: suhani-redis
    ports:
      - "${SUHANI_REDIS_PUBLISH_PORT:-6381}:6379"

  app:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SUHANI_DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-real_estate}?schema=public&connection_limit=10}
      REDIS_URL: ${SUHANI_DOCKER_REDIS_URL:-redis://redis:6379}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://app.deelbot.ai/api}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://app.deelbot.ai}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-deelbot.ai}
      # Must be set in .env.production (Turnstile + SSR). Repeated here so prod overlay never drops them vs base compose merge.
      NUXT_PUBLIC_SITE_KEY: ${NUXT_PUBLIC_SITE_KEY:-}
      NUXT_TURNSTILE_SECRET_KEY: ${NUXT_TURNSTILE_SECRET_KEY:-${NUXT_PUBLIC_SECRET_KEY:-}}
      NUXT_TURNSTILE_VERIFY_URL: ${NUXT_TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      # AI Chat
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_URL: ${GROQ_API_URL:-https://api.groq.com/openai/v1}
      # CREA DDF
      CREA_CLIENT_ID: ${CREA_CLIENT_ID:-}
      CREA_CLIENT_SECRET: ${CREA_CLIENT_SECRET:-}
      CREA_BASE_URL: ${CREA_BASE_URL:-https://ddfapi.realtor.ca}
      # Pillar9 / Matrix
      PILLAR9_CLIENT_ID: ${PILLAR9_CLIENT_ID:-}
      PILLAR9_CLIENT_SECRET: ${PILLAR9_CLIENT_SECRET:-}
      PILLAR9_TOKEN_HOST: ${PILLAR9_TOKEN_HOST:-pillarnine.clareityiam.net}
      PILLAR9_API_HOST: ${PILLAR9_API_HOST:-abrls.matrixwebapi.com}
      PILLAR9_SYNC_SECRET: ${PILLAR9_SYNC_SECRET:-${CRON_SECRET:-}}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PUBLISH_HTTP_PORT:-9080}:80"
      - "${NGINX_PUBLISH_HTTPS_PORT:-9443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network
