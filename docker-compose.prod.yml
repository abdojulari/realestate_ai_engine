services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - NUXT_PUBLIC_FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - NUXT_FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-https://app.deelbot.ai/api}
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-https://app.deelbot.ai}
      - APP_BASE_DOMAIN=${APP_BASE_DOMAIN:-deelbot.ai}
      - CONTROL_PLANE_URL=${CONTROL_PLANE_URL}
      - CONTROL_PLANE_API_KEY=${CONTROL_PLANE_API_KEY}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOSTNAME=${SMTP_HOSTNAME}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SENDER=${SMTP_SENDER}
      - AGENT_EMAIL=${AGENT_EMAIL}
      - OPENCAGE_API_KEY=${OPENCAGE_API_KEY}
      - NUXT_PUBLIC_SITE_KEY=${NUXT_PUBLIC_SITE_KEY}
      - NUXT_PUBLIC_SECRET_KEY=${NUXT_PUBLIC_SECRET_KEY}
      - NUXT_TURNSTILE_VERIFY_URL=${NUXT_TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      # Verdocs e-sign (server only). env_file: .env loads values; these pass the same vars as docker-compose.yml.
      # VERDOCS_API_BASE should be the API origin (https://api.verdocs.com). Server normalizes mistaken /v2 or oauth paths.
      - VERDOCS_CLIENT_ID=${VERDOCS_CLIENT_ID}
      - VERDOCS_CLIENT_SECRET=${VERDOCS_CLIENT_SECRET}
      - VERDOCS_API_BASE=${VERDOCS_API_BASE:-https://api.verdocs.com}
      - VERDOCS_TOKEN_URL=${VERDOCS_TOKEN_URL:-}
      - VERDOCS_API_URL=${VERDOCS_API_URL:-}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
