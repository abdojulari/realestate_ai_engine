# Canonical stack: same services and env shape as production (merge with docker-compose.prod.yml for prod).
# Local: docker compose up
# Production edge (nginx + TLS): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5433:5432"
    shm_size: 256mb
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "hba_file=/var/lib/postgresql/pg_hba_custom.conf"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/var/lib/postgresql/pg_hba_custom.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-real_estate}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_MEMORY: ${DOCKER_NODE_MEMORY:-8192}
    # Must match credentials in --env-file (e.g. .env.production). Default .env for local dev.
    # deploy.sh sets SUHANI_ENV_FILE to the same file as --env-file. Override: SUHANI_ENV_FILE=.env.production
    env_file:
      - ${SUHANI_ENV_FILE:-.env}
    # Full publish spec (host:container or ip:host:container). For host OS Nginx (Option B): 127.0.0.1:3000:3000
    ports:
      - "${SUHANI_APP_PORTS:-3000:3000}"
    # Do not use ${DATABASE_URL} here — .env often has localhost:5433 for host Prisma/npm dev;
    # inside the container the DB hostname must be `db`. URL is built from POSTGRES_* to match the db service.
    # Optional full override: SUHANI_DOCKER_DATABASE_URL (e.g. external Postgres). Avoid @ : / # ? in POSTGRES_PASSWORD or URL-encode.
    environment:
      DATABASE_URL: ${SUHANI_DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-real_estate}?schema=public&connection_limit=10}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
      REDIS_URL: ${SUHANI_DOCKER_REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      NUXT_PUBLIC_FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      NUXT_FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      NUXT_PUBLIC_SITE_KEY: ${NUXT_PUBLIC_SITE_KEY:-}
      # Do not pass NUXT_PUBLIC_SECRET_KEY here — Nuxt would expose it on the client. Compose reads it from --env-file only to populate the private var below.
      NUXT_TURNSTILE_SECRET_KEY: ${NUXT_TURNSTILE_SECRET_KEY:-${NUXT_PUBLIC_SECRET_KEY:-}}
      NUXT_TURNSTILE_VERIFY_URL: ${NUXT_TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      VERDOCS_CLIENT_ID: ${VERDOCS_CLIENT_ID:-}
      VERDOCS_CLIENT_SECRET: ${VERDOCS_CLIENT_SECRET:-}
      VERDOCS_API_BASE: ${VERDOCS_API_BASE:-https://api.verdocs.com}
      VERDOCS_TOKEN_URL: ${VERDOCS_TOKEN_URL:-}
      VERDOCS_API_URL: ${VERDOCS_API_URL:-}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HOSTNAME: ${SMTP_HOSTNAME:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      AGENT_EMAIL: ${AGENT_EMAIL:-}
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
      NUXT_PUBLIC_GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-${VITE_GEOAPIFY:-}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_URL: ${GROQ_API_URL:-https://api.groq.com/openai/v1}
      CREA_CLIENT_ID: ${CREA_CLIENT_ID:-}
      CREA_CLIENT_SECRET: ${CREA_CLIENT_SECRET:-}
      CREA_BASE_URL: ${CREA_BASE_URL:-https://ddfapi.realtor.ca}
      PILLAR9_CLIENT_ID: ${PILLAR9_CLIENT_ID:-}
      PILLAR9_CLIENT_SECRET: ${PILLAR9_CLIENT_SECRET:-}
      PILLAR9_TOKEN_HOST: ${PILLAR9_TOKEN_HOST:-api-trestle.corelogic.com}
      PILLAR9_API_HOST: ${PILLAR9_API_HOST:-abrls.matrixwebapi.com}
      PILLAR9_SYNC_SECRET: ${PILLAR9_SYNC_SECRET:-${CRON_SECRET:-}}
      # Single source of truth for all /uploads/* reads & writes (see server/utils/uploadStorage.ts).
      SUHANI_PUBLIC_UPLOADS_DIR: /app/public/uploads
    volumes:
      - uploads_data:/app/public/uploads
      - marketing_resources_data:/app/storage/marketing-resources
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  marketing_resources_data:
