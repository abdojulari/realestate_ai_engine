# www.deelbot.com + deelbot.com (TLS + redirect) — install AFTER
# /etc/letsencrypt/live/www.deelbot.com/ exists.
# Deployed by: ./scripts/issue-deelbot-com-cert.sh

server {
    listen 80;
    listen [::]:80;
    server_name www.deelbot.com deelbot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.deelbot.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deelbot.com;

    ssl_certificate     /etc/letsencrypt/live/www.deelbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deelbot.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        return 301 https://www.deelbot.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.deelbot.com;

    ssl_certificate     /etc/letsencrypt/live/www.deelbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deelbot.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://host.docker.internal:3001;
    }
}
