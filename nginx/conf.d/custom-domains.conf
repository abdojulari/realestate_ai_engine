# =============================================================================
# Tenant custom domains (HTTPS + proxy to Suhani)
# =============================================================================
# 1. Point DNS A/AAAA for the hostname to this server.
# 2. Issue a certificate (HTTP-01 uses /.well-known on port 80 — enabled on the
#    default_server in nginx.conf):
#      ./scripts/issue-custom-domain-cert.sh you@email.com aohomes.com www.aohomes.com
# 3. Copy server blocks from custom-domains.conf.example into THIS file (below),
#    set server_name and ssl_certificate paths to match certbot output under
#    /etc/letsencrypt/live/<primary-domain>/
# 4. Reload: docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# For a future base domain (e.g. *.propertymatch.estate), use a wildcard cert
# (DNS-01) and one server_name *.propertymatch.estate; block instead of many SANs.
# =============================================================================
