# www.deelbot.com + deelbot.com — BOOTSTRAP (no .com TLS files yet).
#
# Nginx will not start if this file references /etc/letsencrypt/live/www.deelbot.com/
# before those files exist. This version only listens on :80 (proxy + ACME).
#
# After certs exist on the host, run:
#   ./scripts/issue-deelbot-com-cert.sh
# That script installs nginx/deelbot-com.post-ssl.conf over this file and reloads nginx.

server {
    listen 80;
    listen [::]:80;
    server_name deelbot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 http://www.deelbot.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.deelbot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://host.docker.internal:3001;
    }
}
