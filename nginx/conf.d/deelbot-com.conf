# www.deelbot.com + deelbot.com — BOOTSTRAP (no .com TLS files yet).
#
# We cannot reference /etc/letsencrypt/live/www.deelbot.com/ until certbot has run.
# Without a matching listen :443 block, SNI for these names falls through to the
# default_server in nginx.conf, which loads the deelbot.ai certificate — browsers
# see a name mismatch. The block below catches .com on :443 and rejects the
# handshake until real certs are installed (nginx 1.19.4+).
#
# After certs exist on the host, run:
#   ./scripts/issue-deelbot-com-cert.sh
# That copies nginx/deelbot-com.post-ssl.conf over this file and reloads nginx.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.deelbot.com deelbot.com;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name deelbot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 http://www.deelbot.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.deelbot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://host.docker.internal:3001;
    }
}
