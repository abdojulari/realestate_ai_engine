# www.deelbot.com + deelbot.com → SaaS control plane (sibling saas-control-plane on host :3001).
#
# Without this, SNI www.deelbot.com falls through to default_server (443) which only
# loads deelbot.ai certs → wrong certificate / ERR_HTTP2_PROTOCOL_ERROR in browsers.
#
# Prerequisites
# -------------
# 1) Issue TLS once (Let's Encrypt via same webroot as Suhani):
#      ./scripts/issue-deelbot-com-cert.sh
#    That creates /etc/letsencrypt/live/www.deelbot.com/{fullchain.pem,privkey.pem}
#    (mounted from host /etc/letsencrypt in docker-compose.prod.yml).
#
# 2) Nginx container must reach the host where saas-control-plane binds 127.0.0.1:3001:
#      docker-compose.prod.yml → nginx → extra_hosts: host.docker.internal:host-gateway
#
# 3) Reload nginx after certs exist: docker compose ... exec nginx nginx -s reload

# HTTP — ACME + redirect (matches deelbot.ai :80 pattern)
server {
    listen 80;
    server_name www.deelbot.com deelbot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.deelbot.com$request_uri;
    }
}

# HTTPS — reverse proxy to control plane (Stripe / marketing / admin live here)
server {
    listen 443 ssl http2;
    server_name www.deelbot.com deelbot.com;

    ssl_certificate     /etc/letsencrypt/live/www.deelbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deelbot.com/privkey.pem;

    if ($host = deelbot.com) {
        return 301 https://www.deelbot.com$request_uri;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://host.docker.internal:3001;
    }
}
