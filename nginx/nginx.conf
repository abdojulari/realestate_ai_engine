user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time '
                    '"$host"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/xml application/json application/rss+xml
               image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ─── Dynamic upstream resolution ───────────────────────────────
    # Why no `upstream { }` block: nginx resolves names inside
    # `upstream` blocks (and bare `proxy_pass http://hostname;`
    # directives) ONCE at startup and caches the IP forever. When the
    # `app` container is recreated by `docker compose up -d --build`
    # it gets a new IP, but nginx keeps proxying to the old one, which
    # surfaces as a 502 storm until someone manually restarts nginx.
    #
    # The only OSS-nginx pattern that re-resolves on the fly is
    # "variable in proxy_pass + `resolver`". Below we point nginx at
    # Docker's embedded DNS (127.0.0.11) with a short cache TTL, then
    # define `$upstream_app` once at server-block level. Every
    # `proxy_pass $upstream_app;` triggers a fresh resolution (cached
    # for `valid=10s`), so app redeploys are picked up automatically
    # within ten seconds — no nginx restart needed.
    #
    # Trade-off: we lose the connection-pool benefit of
    # `upstream { keepalive 32; }`. Acceptable here — Nuxt requests
    # are not so high-throughput that the extra TCP handshake matters,
    # and the alternative (NGINX Plus's `server ... resolve;` flag) is
    # not in the OSS image.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # SSL session caching (shared across workers)
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling — no-op as of early-2026 because Let's Encrypt
    # stopped publishing OCSP responder URLs in new certs (warning
    # "ssl_stapling ignored, no OCSP responder URL in the certificate"
    # is harmless and shows up at every reload). Kept here so it
    # transparently re-activates if a future cert ships an OCSP URL.
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── deelbot.ai apex + wildcard *.deelbot.ai (tenant subdomains) ─────
    # The apex MUST be listed alongside the wildcard. `*.deelbot.ai` does
    # not match the bare `deelbot.ai`, so without this Google's OAuth
    # callback (which lands on the apex per `OAUTH_CANONICAL_HOST`) falls
    # through to the catch-all default_server below, hits `return 444`,
    # and the browser surfaces `ERR_HTTP2_PROTOCOL_ERROR` because the
    # HTTP/2 stream is torn down before any response headers.
    server {
        listen 80;
        server_name deelbot.ai *.deelbot.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name deelbot.ai *.deelbot.ai;

        ssl_certificate /etc/letsencrypt/live/deelbot.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deelbot.ai/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https: wss:;" always;

        # Dynamic upstream — must contain a variable so nginx defers
        # resolution to request time via the `resolver` directive
        # configured at http-level. See the comment block above the
        # resolver. Every location below uses `proxy_pass $upstream_app;`.
        set $upstream_app "http://app:3000";

        # Proxy common headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Domain $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Admin sync endpoints need long timeouts (MLS data pulls can take minutes)
        location /api/admin/pillar9/ {
            proxy_pass $upstream_app;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        location /api/admin/crea/ {
            proxy_pass $upstream_app;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # API endpoints with rate limiting
        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass $upstream_app;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass $upstream_app;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # WebSocket support
        location /ws {
            proxy_pass $upstream_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400;
        }

        # ^~ stops regex locations from stealing /uploads; always proxy to Nuxt (same volume as writes).
        location ^~ /uploads/ {
            proxy_pass $upstream_app;
            proxy_buffering off;
        }

        # Nuxt static assets with long cache
        location /_nuxt/ {
            proxy_pass $upstream_app;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Default: proxy to Nuxt
        location / {
            limit_conn addr 50;
            proxy_pass $upstream_app;
        }

        # Deny hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # www.deelbot.com — see nginx/conf.d/deelbot-com.conf and scripts/issue-deelbot-com-cert.sh
    # If /etc/letsencrypt/live/www.deelbot.com/ is missing, run the script while nginx still
    # runs a config that starts (then pull + reload) so HTTP-01 on :80 can complete.
    include /etc/nginx/conf.d/deelbot-com.conf;

    # ─── Tenant custom domains (per-hostname TLS; edit conf.d/custom-domains.conf) ─
    include /etc/nginx/conf.d/custom-domains.conf;

    # ─── Default: unknown hostnames ───────────────────────────────
    # Port 80: allow ACME HTTP-01 for any hostname pointing at this IP (needed before
    # the first HTTPS server block exists for that domain).
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 444;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/deelbot.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deelbot.ai/privkey.pem;

        return 444;
    }
}
