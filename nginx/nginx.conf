user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time '
                    '"$host"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/xml application/json application/rss+xml
               image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream Nuxt app
    upstream suhani_app {
        server app:3000;
        keepalive 32;
    }

    # SSL session caching (shared across workers)
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ─── Wildcard *.deelbot.ai (tenant subdomains) ─────────────────
    server {
        listen 80;
        server_name *.deelbot.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name *.deelbot.ai;

        ssl_certificate /etc/letsencrypt/live/deelbot.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deelbot.ai/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https: wss:;" always;

        # Proxy common headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Domain $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Admin sync endpoints need long timeouts (MLS data pulls can take minutes)
        location /api/admin/pillar9/ {
            proxy_pass http://suhani_app;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        location /api/admin/crea/ {
            proxy_pass http://suhani_app;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # API endpoints with rate limiting
        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://suhani_app;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://suhani_app;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # WebSocket support
        location /ws {
            proxy_pass http://suhani_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400;
        }

        # ^~ stops regex locations from stealing /uploads; always proxy to Nuxt (same volume as writes).
        location ^~ /uploads/ {
            proxy_pass http://suhani_app;
            proxy_buffering off;
        }

        # Nuxt static assets with long cache
        location /_nuxt/ {
            proxy_pass http://suhani_app;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Default: proxy to Nuxt
        location / {
            limit_conn addr 50;
            proxy_pass http://suhani_app;
        }

        # Health check
        location /health {
            access_log off;
            proxy_pass http://suhani_app;
        }

        # Deny hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ─── Tenant custom domains (per-hostname TLS; edit conf.d/custom-domains.conf) ─
    include /etc/nginx/conf.d/custom-domains.conf;

    # ─── Default: unknown hostnames ───────────────────────────────
    # Port 80: allow ACME HTTP-01 for any hostname pointing at this IP (needed before
    # the first HTTPS server block exists for that domain).
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 444;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/deelbot.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deelbot.ai/privkey.pem;

        return 444;
    }
}
